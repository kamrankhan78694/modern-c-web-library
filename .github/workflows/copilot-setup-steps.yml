name: "Copilot Setup Steps"

# Automatically run the setup steps when they are changed to allow for easy validation, and
# allow manual testing through the repository's "Actions" tab
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
  copilot-setup-steps:
    runs-on: ubuntu-latest

    # Set the permissions to the lowest permissions possible needed for your steps.
    # Copilot will be given its own token for its operations.
    permissions:
      # Needed to clone the repository to install dependencies.
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build development Docker image
        run: docker build -f Dockerfile.dev -t modern-c-weblib:dev .

      - name: Run tests inside Docker
        run: docker run --rm modern-c-weblib:dev /bin/bash -c "cd build && ctest --output-on-failure --timeout 120"

      - name: Verify examples are built
        run: docker run --rm modern-c-weblib:dev /bin/bash -c "test -x build/examples/simple_server && test -x build/examples/async_server"

      - name: Install build dependencies for native tooling
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q cmake gcc build-essential valgrind

      - name: Build project natively
        run: |
          mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Debug
          make -j$(nproc)

      - name: Install library into system
        run: |
          sudo cmake --install build
          sudo ldconfig
