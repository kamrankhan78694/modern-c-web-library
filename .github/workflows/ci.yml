name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # All five jobs run in PARALLEL. They used to be staged behind
  # primary-checks ("save minutes if the primary fails"), but this is a
  # public repository — Actions minutes are free, macOS included — so the
  # gate saved nothing and doubled wall time: ~6.5 min (3.5 primary + 2.7
  # slowest secondary) instead of ~3.5 (the longest single job). The
  # concurrency group above already cancels superseded runs on the same ref.
  #
  # primary-checks: GCC build, full test suite, and Valgrind memcheck, all
  # inside Dockerfile.dev (which already ships gcc + valgrind). Docker
  # Buildx layer caching keeps rebuilds fast.
  primary-checks:
    name: Build, Test & Memcheck (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build dev image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.dev
          load: true
          tags: modern-c-weblib:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run tests
        run: docker run --rm modern-c-weblib:dev /bin/bash -c "cd build && ctest --output-on-failure --timeout 120"

      # A shell for-loop exits with the status of its LAST iteration, so the
      # previous version of this step reported Valgrind failures for every
      # binary but only *gated* on the last one (test_worker, by glob order) —
      # a definite leak in test_weblib or test_stress was printed and then
      # discarded, and the job stayed green. `rc` accumulates instead, so every
      # binary still runs (one failure does not mask the rest) and any failure
      # fails the step. --errors-for-leak-kinds is stated explicitly rather than
      # relying on Valgrind's default, so the intent survives a version bump.
      - name: Valgrind memory check
        run: |
          docker run --rm modern-c-weblib:dev /bin/bash -c '
            cd build || exit 1
            rc=0
            ran=0
            for test_bin in tests/test_*; do
              if [ -x "$test_bin" ]; then
                echo "=== Valgrind: $test_bin ==="
                ran=$((ran+1))
                valgrind \
                  --leak-check=full \
                  --error-exitcode=1 \
                  --errors-for-leak-kinds=definite,indirect \
                  --show-leak-kinds=definite,indirect \
                  ./"$test_bin" || rc=1
              fi
            done
            if [ "$ran" -eq 0 ]; then
              echo "ERROR: no test binaries matched tests/test_* - nothing was checked" >&2
              exit 1
            fi
            echo "Valgrind checked $ran test binaries."
            exit $rc
          '

  # Clang compilation — catches warnings/errors that GCC misses.
  # No valgrind (already covered above), so this is a lightweight job.
  clang-check:
    name: Clang Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q cmake clang

      - name: Configure
        run: |
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_FLAGS="-Wall -Wextra -pedantic"

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: cd build && ctest --output-on-failure --timeout 120

  # Experimental pure-C TLS 1.3 layer.  TLS is OFF by default, so the jobs
  # above build and test the library with NONE of src/tls/ compiled — without
  # this job the ~5,500 lines of hand-written crypto and the handshake state
  # machine (7 ctest suites, incl. 86 crypto KATs and a real `openssl s_client`
  # interop round-trip) would never run in CI at all.
  #
  # Two configurations, because they catch different failures:
  #   1. Release-ish build + full suite — correctness and real-client interop.
  #   2. ASan/UBSan build — memory safety and UB in hand-written crypto, which
  #      the plain build cannot detect.  This mirrors the sanitizer gate applied
  #      manually to every TLS change; running it here makes it enforceable.
  #
  # WEBLIB_TLS_TEST_HOOKS exposes a deterministic-RNG seam used only by
  # TlsHttpTests; it is OFF in any production build.
  tls-check:
    name: TLS Build & Test (experimental layer)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q cmake clang openssl

      # openssl must be real OpenSSL with a TLS 1.3-capable s_client, otherwise
      # the interop test self-skips rather than failing.  Log it so a silent
      # skip is visible in the run rather than looking like a pass.
      - name: Show openssl version (interop test prerequisite)
        run: openssl version

      - name: Configure (TLS on)
        run: |
          mkdir -p build-tls && cd build-tls
          cmake .. \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DWEBLIB_ENABLE_TLS=ON \
            -DWEBLIB_TLS_TEST_HOOKS=ON \
            -DCMAKE_C_FLAGS="-Wall -Wextra -pedantic"

      - name: Build (TLS on)
        run: cmake --build build-tls --parallel

      - name: Run full test suite (TLS on)
        run: cd build-tls && ctest --output-on-failure --timeout 300 --no-tests=error

      - name: Configure (ASan + UBSan)
        run: |
          mkdir -p build-tls-san && cd build-tls-san
          cmake .. \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_BUILD_TYPE=Debug \
            -DWEBLIB_ENABLE_TLS=ON \
            -DWEBLIB_TLS_TEST_HOOKS=ON \
            -DCMAKE_C_FLAGS="-Wall -Wextra -pedantic -fsanitize=address,undefined -fno-omit-frame-pointer -g"

      - name: Build (ASan + UBSan)
        run: cmake --build build-tls-san --parallel

      # Only the TLS suites: the sanitizer signal we care about here is in the
      # crypto/parser/state-machine code.  halt_on_error makes UB fatal instead
      # of merely logged, so a regression fails the job.  --no-tests=error is
      # essential with -R: ctest exits 0 when a filter matches nothing, so a
      # rename or a dropped add_test() would silently stop running the suites
      # while the job stayed green — the exact failure this whole job removes.
      - name: Run TLS suites under ASan/UBSan
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: cd build-tls-san && ctest --output-on-failure --timeout 300 --no-tests=error -R '^Tls'

  # macOS cross-platform check — runs only on pull requests: every push to
  # main lands via a PR here, so the PR run already covered that commit and a
  # second identical run on main adds latency without information.
  macos-check:
    name: macOS Compatibility
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install cmake

      - name: Configure
        run: |
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_FLAGS="-Wall -Wextra -pedantic"

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: cd build && ctest --output-on-failure --timeout 120

  # Production Docker image — validates that the release image builds
  # and contains working executables.  Only runs when Dockerfiles or
  # source code change (skipped for docs-only / CI-only edits).
  docker-image-check:
    name: Production Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: modern-c-weblib:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify production image
        run: |
          docker run --rm modern-c-weblib:latest /bin/bash -c '
            echo "Checking simple_server..." && test -x /app/simple_server && echo "  OK" &&
            echo "Checking async_server..."  && test -x /app/async_server  && echo "  OK" &&
            echo "Production image verified successfully"
          '
