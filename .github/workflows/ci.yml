name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-build-and-test:
    name: Docker build & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build dev image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.dev
          load: true
          tags: modern-c-weblib:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run tests in Docker
        run: docker run --rm modern-c-weblib:dev /bin/bash -c "cd build && ctest --output-on-failure --timeout 120"

      - name: Valgrind memory check in Docker
        run: |
          docker run --rm modern-c-weblib:dev /bin/bash -c '
            cd build
            for test_bin in tests/test_*; do
              if [ -x "$test_bin" ]; then
                echo "=== Valgrind: $test_bin ==="
                valgrind \
                  --leak-check=full \
                  --error-exitcode=1 \
                  --show-leak-kinds=definite,indirect \
                  ./"$test_bin"
              fi
            done
          '

      - name: Build production image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: modern-c-weblib:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify production image
        run: |
          docker run --rm modern-c-weblib:latest /bin/bash -c "test -x /app/simple_server && test -x /app/async_server"

  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            c_compiler: gcc
          - os: ubuntu-latest
            compiler: clang
            c_compiler: clang
          - os: macos-latest
            compiler: clang
            c_compiler: clang

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q cmake build-essential valgrind

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake

      - name: Configure (cmake)
        run: |
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_FLAGS="-Wall -Wextra -pedantic"

      - name: Build
        run: cmake --build build --parallel

      - name: Run all tests (ctest)
        run: |
          cd build
          ctest --output-on-failure --timeout 120

      - name: Valgrind memory check (Linux gcc only)
        if: runner.os == 'Linux' && matrix.compiler == 'gcc'
        run: |
          cd build
          # Run valgrind on every test binary discovered in the tests/ dir
          for test_bin in tests/test_*; do
            if [ -x "$test_bin" ]; then
              echo "=== Valgrind: $test_bin ==="
              valgrind \
                --leak-check=full \
                --error-exitcode=1 \
                --show-leak-kinds=definite,indirect \
                ./"$test_bin"
            fi
          done
